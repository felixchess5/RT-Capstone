services:
  backend:
    image: python:3.11-slim
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-Assignment Grader}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:7860,http://127.0.0.1:7860}
      APP_GIT_REF: ${APP_GIT_REF:-main}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - backend_output:/app/output
      - backend_reports:/app/plagiarism_reports
    command: >
      bash -lc "
      set -e;
      apt-get update;
      apt-get install -y --no-install-recommends git tesseract-ocr poppler-utils libmagic1;
      rm -rf /var/lib/apt/lists/*;
      rm -rf /opt/src/repo;
      git clone --depth 1 --branch ${APP_GIT_REF} https://github.com/felixchess5/Intelligent-Assignment-Grading-System.git /opt/src/repo;
      pip install --upgrade pip;
      pip install -r /opt/src/repo/requirements-core.txt;
      python -m uvicorn --app-dir /opt/src/repo/src server.main:app --host 0.0.0.0 --port 8000
      "

  demo:
    image: python:3.11-slim
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: ${GRADIO_SERVER_PORT:-7860}
      GRADIO_SHARE: ${GRADIO_SHARE:-false}
      APP_GIT_REF: ${APP_GIT_REF:-main}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
    volumes:
      - demo_output:/app/demo_output
    command: >
      bash -lc "
      set -e;
      apt-get update;
      apt-get install -y --no-install-recommends git;
      rm -rf /var/lib/apt/lists/*;
      rm -rf /opt/src/repo;
      git clone --depth 1 --branch ${APP_GIT_REF} https://github.com/felixchess5/Intelligent-Assignment-Grading-System.git /opt/src/repo;
      pip install --upgrade pip;
      pip install -r /opt/src/repo/requirements-demo.txt;
      python /opt/src/repo/launch_gradio.py
      "

volumes:
  backend_output:
  backend_reports:
  demo_output:
